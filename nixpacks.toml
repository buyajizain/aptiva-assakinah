[phases.setup]
nixPkgs = [
  'php83',
  'php83Extensions.zip',
  'php83Extensions.pdo_mysql',
  'php83Extensions.mbstring',
  'php83Extensions.gd',
  'php83Extensions.bcmath',
  'php83Extensions.curl',
  'php83Packages.composer',
  'nodejs_20'
]

[phases.install]
cmds = [
  'composer install --optimize-autoloader --no-dev --ignore-platform-reqs',
  'npm install'
]

[phases.build]
cmds = [
  'npm run build'
]

[start]
cmd = 'php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}'
